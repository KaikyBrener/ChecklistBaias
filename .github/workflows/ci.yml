name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Servidor (tipos e testes)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Front-end (tipos e build)
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Auditoria de dependências (produção)
        run: |
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
